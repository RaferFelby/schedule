name: iOS and watchOS checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  apple_checks:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Verify toolchain
        run: |
          flutter --version
          dart --version

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze Dart sources
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build iOS app and widgets
        run: flutter build ios --simulator --no-codesign

      - name: Build Apple Watch app and widget
        run: >-
          xcodebuild -project ios/Runner.xcodeproj
          -scheme CelechronWatch
          -destination 'generic/platform=watchOS Simulator'
          -derivedDataPath build/watchDerivedData
          CODE_SIGNING_ALLOWED=NO build

      - name: Test Watch legacy credential cleanup
        run: bash ios/CelechronWatchTests/run_tests.sh
